[project]
name = "askdb-agent"
version = "0.1.0"
description = "LangGraph agent service for AskDB with Wren AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "argon2-cffi>=25.1,<26",
    "cryptography>=45,<51",
    "httpx2[socks]>=2.13,<3",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
    "wren-langchain>=0.2,<0.3",
    "wrenai[athena,bigquery,clickhouse,databricks,mssql,mysql,oracle,postgres,redshift,snowflake,trino]>=0.15,<0.16",
    "sqlglot>=30,<31",
    "tiktoken>=0.14,<1",
]

[project.scripts]
askdb-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]
