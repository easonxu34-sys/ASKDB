relationships:
- name: customer_district
  models:
  - customer
  - district
  join_type: many_to_one
  condition: customer.c_w_id = district.d_w_id AND customer.c_d_id = district.d_id
- name: district_warehouse
  models:
  - district
  - warehouse
  join_type: many_to_one
  condition: district.d_w_id = warehouse.w_id
- name: history_customer
  models:
  - payment_history
  - customer
  join_type: many_to_one
  condition: payment_history.h_c_w_id = customer.c_w_id AND payment_history.h_c_d_id = customer.c_d_id AND payment_history.h_c_id
    = customer.c_id
- name: new_order_order
  models:
  - new_order
  - orders
  join_type: one_to_one
  condition: new_order.no_w_id = orders.o_w_id AND new_order.no_d_id = orders.o_d_id AND new_order.no_o_id = orders.o_id
- name: order_customer
  models:
  - orders
  - customer
  join_type: many_to_one
  condition: orders.o_w_id = customer.c_w_id AND orders.o_d_id = customer.c_d_id AND orders.o_c_id = customer.c_id
- name: order_line_item
  models:
  - order_line
  - item
  join_type: many_to_one
  condition: order_line.ol_i_id = item.i_id
- name: order_line_order
  models:
  - order_line
  - orders
  join_type: many_to_one
  condition: order_line.ol_w_id = orders.o_w_id AND order_line.ol_d_id = orders.o_d_id AND order_line.ol_o_id = orders.o_id
- name: order_line_stock
  models:
  - order_line
  - stock
  join_type: many_to_one
  condition: order_line.ol_supply_w_id = stock.s_w_id AND order_line.ol_i_id = stock.s_i_id
- name: stock_item
  models:
  - stock
  - item
  join_type: many_to_one
  condition: stock.s_i_id = item.i_id
- name: stock_warehouse
  models:
  - stock
  - warehouse
  join_type: many_to_one
  condition: stock.s_w_id = warehouse.w_id
